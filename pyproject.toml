[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos"
version = "0.1.0"
description = "Large memory models: pluggable memory layers, a training loop, and the controls that tell you whether the memory is doing the work."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
mnemos = "mnemos.cli:main"

[tool.setuptools.packages.find]
include = ["mnemos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
